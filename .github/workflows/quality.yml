name: PumaMap quality gates
on:
  push:
    branches: [main, 'work/**', 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pumamap
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: pumamap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U pumamap -d pumamap_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pumamap:ci-only-disposable-password@127.0.0.1:5432/pumamap_test
      APP_ORIGIN: http://127.0.0.1:3000
      MAIL_MODE: file
      TEST_DATABASE_CONFIRM: isolated
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run check:source
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - name: Verify migration replay
        run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run test:migrations
      - run: npm run db:seed
      - run: npm run build
      - name: Verify complete source and Git restore
        run: python3 scripts/export-project.py "$RUNNER_TEMP/pumamap-checkpoint.zip"
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
